<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAIGYM - Workout Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-orange-500 selection:text-white pb-12">

    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-black tracking-wider text-orange-500 uppercase">JAI<span class="text-white">GYM</span></h1>
            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700">7-Day Split</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- View 1: Days Grid & Monthly Tracker -->
        <div id="days-view" class="space-y-6">
            
            <!-- Monthly Gym Attendance Tracker & Streaks -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-5">
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <h2 id="month-title" class="text-lg sm:text-2xl font-black tracking-tight text-white">Month Year</h2>
                        <!-- Month Navigation Buttons -->
                        <div class="flex items-center gap-1 bg-zinc-950 border border-zinc-800 rounded-xl p-1">
                            <button onclick="changeMonth(-1)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 transition" title="Previous Month">
                                &larr;
                            </button>
                            <button onclick="changeMonth(1)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 transition" title="Next Month">
                                &rarr;
                            </button>
                        </div>
                    </div>
                    <p class="text-xs text-zinc-400">Tap any day to toggle whether you went to the gym.</p>
                </div>

                <!-- Stats Badges -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-zinc-950 border border-zinc-800 px-2 py-2.5 rounded-xl text-center">
                        <span class="block text-[9px] text-zinc-500 uppercase font-bold">Streak</span>
                        <strong id="current-streak" class="text-orange-500 text-xs sm:text-sm">0 Days</strong>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 px-2 py-2.5 rounded-xl text-center">
                        <span class="block text-[9px] text-zinc-500 uppercase font-bold">Best</span>
                        <strong id="best-streak" class="text-zinc-200 text-xs sm:text-sm">0 Days</strong>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 px-2 py-2.5 rounded-xl text-center">
                        <span class="block text-[9px] text-zinc-500 uppercase font-bold">Total</span>
                        <strong id="total-attended" class="text-zinc-200 text-xs sm:text-sm">0</strong>
                    </div>
                </div>

                <!-- Day Headers (Mon-Sun) -->
                <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold text-zinc-500 uppercase">
                    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                </div>

                <!-- Calendar Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Workout Split Section -->
            <div>
                <div class="mb-3">
                    <h2 class="text-2xl font-extrabold tracking-tight">Your Workout Split</h2>
                    <p class="text-zinc-400 text-xs sm:text-sm mt-0.5">Tap a day to view, log, or edit your exercises.</p>
                </div>
                
                <div id="days-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <!-- Dynamically injected via JavaScript -->
                </div>
            </div>
        </div>

        <!-- View 2: Day Detail & Logger / Rest Day Recovery Log -->
        <div id="detail-view" class="hidden space-y-4">
            <div>
                <button onclick="goBack()" class="text-sm text-orange-500 hover:text-orange-400 font-medium flex items-center gap-1 mb-2 transition">
                    &larr; Back to Dashboard
                </button>
                <h2 id="day-title" class="text-2xl sm:text-3xl font-black tracking-tight uppercase">Day Name</h2>
            </div>

            <!-- Content for Active Days -->
            <div id="active-day-content" class="space-y-4">
                <!-- Add Exercise Form -->
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <h3 class="text-base font-bold mb-3 text-zinc-200">Log New Exercise</h3>
                    <form id="exercise-form" onsubmit="addExercise(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Exercise Name</label>
                            <input type="text" id="ex-name" required placeholder="e.g. Bench Press" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Weight</label>
                                <input type="text" id="ex-weight" required placeholder="e.g. 60kg" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Sets x Reps</label>
                                <input type="text" id="ex-sets-reps" required placeholder="e.g. 3 x 10" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-orange-600/20 mt-2">
                            Add Exercise
                        </button>
                    </form>
                </div>

                <!-- Exercises List Table/Cards -->
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <h3 class="text-base font-bold mb-3 text-zinc-200">Logged Exercises</h3>
                    <div id="exercises-container" class="space-y-3">
                        <!-- Dynamically injected rows -->
                    </div>
                </div>
            </div>

            <!-- Content for Rest Days (Recovery Log) -->
            <div id="rest-day-content" class="hidden space-y-4">
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base font-bold text-zinc-200">Rest & Recovery Journal</h3>
                        <span class="text-[11px] font-semibold px-2.5 py-1 bg-zinc-800 text-zinc-400 rounded-lg">Recovery</span>
                    </div>
                    
                    <form id="recovery-form" onsubmit="saveRecoveryLog(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Sleep (Hours)</label>
                                <input type="text" id="rec-sleep" placeholder="e.g. 8 hrs" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Water (Litres)</label>
                                <input type="text" id="rec-water" placeholder="e.g. 3.5L" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Muscle Soreness</label>
                            <select id="rec-soreness" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-orange-500 transition">
                                <option value="Fresh & Relaxed">Fresh & Relaxed 🟢</option>
                                <option value="Mild Soreness">Mild Soreness 🟡</option>
                                <option value="Very Sore / Fatigued">Very Sore / Fatigued 🔴</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 uppercase mb-1">Notes / Stretching</label>
                            <textarea id="rec-notes" rows="3" placeholder="How do you feel?" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-orange-600/20">
                            Save Recovery Log
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const daysData = [
            { id: 1, name: "Day 1: Push", type: "workout", focus: "Chest, Shoulders, Triceps" },
            { id: 2, name: "Day 2: Pull", type: "workout", focus: "Back, Biceps, Rear Delts" },
            { id: 3, name: "Day 3: Legs", type: "workout", focus: "Quads, Hamstrings, Calves, Abs" },
            { id: 4, name: "Day 4: Rest", type: "rest", focus: "Recovery & Mobility" },
            { id: 5, name: "Day 5: Upper", type: "workout", focus: "Compound Upper Body Focus" },
            { id: 6, name: "Day 6: Lower", type: "workout", focus: "Compound Lower Body Focus" },
            { id: 7, name: "Day 7: Rest", type: "rest", focus: "Recovery & Mobility" }
        ];

        let currentDayId = null;
        let viewDate = new Date();

        function getStorageData() {
            const data = localStorage.getItem('jaigym_data');
            if (data) return JSON.parse(data);
            const initial = {};
            daysData.forEach(d => initial[d.id] = []);
            return initial;
        }

        function saveStorageData(data) {
            localStorage.setItem('jaigym_data', JSON.stringify(data));
        }

        function getAttendanceData() {
            const data = localStorage.getItem('jaigym_attendance');
            return data ? JSON.parse(data) : {}; 
        }

        function saveAttendanceData(data) {
            localStorage.setItem('jaigym_attendance', JSON.stringify(data));
        }

        function getRecoveryData() {
            const data = localStorage.getItem('jaigym_recovery');
            return data ? JSON.parse(data) : {}; 
        }

        function saveRecoveryData(data) {
            localStorage.setItem('jaigym_recovery', JSON.stringify(data));
        }

        function renderDashboard() {
            renderDaysGrid();
            renderCalendar();
        }

        function renderDaysGrid() {
            const grid = document.getElementById('days-grid');
            const data = getStorageData();
            grid.innerHTML = '';

            daysData.forEach(day => {
                const exerciseCount = data[day.id] ? data[day.id].length : 0;
                const isRest = day.type === 'rest';

                const card = document.createElement('div');
                card.className = `group relative bg-zinc-900 border ${isRest ? 'border-zinc-800/60' : 'border-zinc-800 hover:border-orange-500/50'} rounded-2xl p-4 sm:p-5 cursor-pointer transition-all active:scale-[0.99]`;
                card.onclick = () => openDay(day.id);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded-md ${isRest ? 'bg-zinc-800 text-zinc-400' : 'bg-orange-500/10 text-orange-500 border border-orange-500/20'}">
                            DAY ${day.id}
                        </span>
                        <span class="text-[11px] text-zinc-500 font-medium">${isRest ? 'Rest Log' : `${exerciseCount} exercises`}</span>
                    </div>
                    <h3 class="text-lg font-bold text-zinc-100 group-hover:text-orange-500 transition">${day.name.split(': ')[1]}</h3>
                    <p class="text-[11px] text-zinc-400 mt-0.5">${day.focus}</p>
                `;
                grid.appendChild(card);
            });
        }

        function renderCalendar() {
            const calendarGrid = document.getElementById('calendar-grid');
            const monthTitle = document.getElementById('month-title');
            const totalAttendedEl = document.getElementById('total-attended');
            const currentStreakEl = document.getElementById('current-streak');
            const bestStreakEl = document.getElementById('best-streak');
            
            calendarGrid.innerHTML = '';

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthTitle.textContent = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const adjustedFirstDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const attendance = getAttendanceData();

            let attendedCount = 0;

            for (let i = 0; i < adjustedFirstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-11 sm:h-14 bg-zinc-950/30 rounded-xl opacity-20";
                calendarGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isWent = attendance[dayString] === true;

                if (isWent) attendedCount++;

                const cell = document.createElement('div');
                cell.className = `h-11 sm:h-14 flex flex-col items-center justify-center rounded-xl border text-xs font-bold cursor-pointer transition-all select-none ${
                    isWent 
                    ? 'bg-orange-600 border-orange-500 text-white shadow-md shadow-orange-600/20' 
                    : 'bg-zinc-950 border-zinc-800 text-zinc-400 active:bg-zinc-900'
                }`;
                
                cell.innerHTML = `
                    <span>${day}</span>
                    <span class="text-[8px] font-normal opacity-80">${isWent ? 'Gym ✓' : '-'}</span>
                `;

                cell.onclick = () => toggleAttendance(dayString);
                calendarGrid.appendChild(cell);
            }

            totalAttendedEl.textContent = attendedCount;

            let currentStreak = 0;
            let bestStreak = 0;
            let tempStreak = 0;
            
            const today = new Date();
            for (let i = 0; i < 60; i++) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                
                if (attendance[dStr]) {
                    tempStreak++;
                    if (i === 0 || (currentStreak > 0 && tempStreak > currentStreak)) {
                        currentStreak = tempStreak;
                    }
                } else {
                    if (i === 0) currentStreak = 0;
                    tempStreak = 0;
                }
                if (tempStreak > bestStreak) bestStreak = tempStreak;
            }

            currentStreakEl.textContent = `${currentStreak} Days`;
            bestStreakEl.textContent = `${bestStreak} Days`;
        }

        function changeMonth(direction) {
            viewDate.setMonth(viewDate.getMonth() + direction);
            renderCalendar();
        }

        function toggleAttendance(dateStr) {
            const attendance = getAttendanceData();
            attendance[dateStr] = !attendance[dateStr];
            saveAttendanceData(attendance);
            renderCalendar();
        }

        function openDay(dayId) {
            currentDayId = dayId;
            const day = daysData.find(d => d.id === dayId);

            document.getElementById('days-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('day-title').textContent = day.name;

            const activeContent = document.getElementById('active-day-content');
            const restContent = document.getElementById('rest-day-content');

            if (day.type === 'rest') {
                activeContent.classList.add('hidden');
                restContent.classList.remove('hidden');
                loadRecoveryLog();
            } else {
                restContent.classList.add('hidden');
                activeContent.classList.remove('hidden');
                renderExercises();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            currentDayId = null;
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('days-view').classList.remove('hidden');
            renderDashboard();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveRecoveryLog(e) {
            e.preventDefault();
            const sleep = document.getElementById('rec-sleep').value;
            const water = document.getElementById('rec-water').value;
            const soreness = document.getElementById('rec-soreness').value;
            const notes = document.getElementById('rec-notes').value;

            const recoveryData = getRecoveryData();
            recoveryData[currentDayId] = { sleep, water, soreness, notes };
            saveRecoveryData(recoveryData);
            alert("Recovery log saved! 💤");
        }

        function loadRecoveryLog() {
            const recoveryData = getRecoveryData();
            const log = recoveryData[currentDayId] || { sleep: '', water: '', soreness: 'Fresh & Relaxed', notes: '' };

            document.getElementById('rec-sleep').value = log.sleep;
            document.getElementById('rec-water').value = log.water;
            document.getElementById('rec-soreness').value = log.soreness;
            document.getElementById('rec-notes').value = log.notes;
        }

        function addExercise(e) {
            e.preventDefault();
            const name = document.getElementById('ex-name').value;
            const weight = document.getElementById('ex-weight').value;
            const setsReps = document.getElementById('ex-sets-reps').value;

            const data = getStorageData();
            if (!data[currentDayId]) data[currentDayId] = [];

            data[currentDayId].push({
                id: Date.now(),
                name,
                weight,
                setsReps
            });

            saveStorageData(data);
            document.getElementById('exercise-form').reset();
            renderExercises();
        }

        function renderExercises() {
            const container = document.getElementById('exercises-container');
            const data = getStorageData();
            const exercises = data[currentDayId] || [];

            if (exercises.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 italic py-4 text-center">No exercises logged for this day yet. Add one above!</p>`;
                return;
            }

            container.innerHTML = '';
            exercises.forEach((ex, index) => {
                const item = document.createElement('div');
                item.className = `flex flex-col sm:flex-row items-start sm:items-center justify-between bg-zinc-950 border border-zinc-800/80 rounded-xl p-3.5 gap-3`;
                
                item.innerHTML = `
                    <div class="space-y-1 w-full sm:w-auto">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-orange-500">#${index + 1}</span>
                            <h4 class="font-bold text-zinc-100 text-sm" id="name-${ex.id}">${ex.name}</h4>
                        </div>
                        <div class="flex gap-4 text-xs text-zinc-400">
                            <span>Weight: <strong class="text-zinc-200" id="weight-${ex.id}">${ex.weight}</strong></span>
                            <span>Sets/Reps: <strong class="text-zinc-200" id="sets-${ex.id}">${ex.setsReps}</strong></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-zinc-900">
                        <button onclick="editExercise(${ex.id})" id="edit-btn-${ex.id}" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold rounded-lg transition">Edit</button>
                        <button onclick="deleteExercise(${ex.id})" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-lg transition">Delete</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function deleteExercise(exId) {
            const data = getStorageData();
            data[currentDayId] = data[currentDayId].filter(ex => ex.id !== exId);
            saveStorageData(data);
            renderExercises();
        }

        function editExercise(exId) {
            const data = getStorageData();
            const ex = data[currentDayId].find(item => item.id === exId);
            if (!ex) return;

            const nameEl = document.getElementById(`name-${exId}`);
            const weightEl = document.getElementById(`weight-${exId}`);
            const setsEl = document.getElementById(`sets-${exId}`);
            const btnEl = document.getElementById(`edit-btn-${exId}`);

            nameEl.innerHTML = `<input type="text" id="edit-n-${exId}" value="${ex.name}" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-xs text-white w-full">`;
            weightEl.innerHTML = `<input type="text" id="edit-w-${exId}" value="${ex.weight}" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-xs text-white w-20">`;
            setsEl.innerHTML = `<input type="text" id="edit-s-${exId}" value="${ex.setsReps}" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-xs text-white w-20">`;

            btnEl.textContent = "Save";
            btnEl.className = "px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white text-xs font-semibold rounded-lg transition";
            btnEl.setAttribute('onclick', `saveEdit(${exId})`);
        }

        function saveEdit(exId) {
            const newName = document.getElementById(`edit-n-${exId}`).value;
            const newWeight = document.getElementById(`edit-w-${exId}`).value;
            const newSets = document.getElementById(`edit-s-${exId}`).value;

            const data = getStorageData();
            const ex = data[currentDayId].find(item => item.id === exId);
            if (ex) {
                ex.name = newName;
                ex.weight = newWeight;
                ex.setsReps = newSets;
                saveStorageData(data);
            }
            renderExercises();
        }

        renderDashboard();
    </script>
</body>
</html>
